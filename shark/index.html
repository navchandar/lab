<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Shark</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐟</text></svg>" />

    <meta name="description" content="Baby shark built with svg that moves in smooth UI animations and transitions." />
    <meta name="keywords" content="Game, Baby Shark, Children's games" />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Naveenchandar">
    <meta property="article:author" content="Naveenchandar">

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://navchandar.github.io/lab/shark/" />
    <meta property="og:title" content="Baby Shark" />
    <meta property="og:description"
        content="Baby shark built with svg that moves in smooth UI animations and transitions." />
    <meta property="og:image" content="https://navchandar.github.io/lab/shark/preview.png" />

    <meta property="twitter:title" content="Baby Shark" />
    <meta property="twitter:description"
        content="Baby shark built with svg that moves in smooth UI animations and transitions." />
    <meta property="twitter:image" content="https://navchandar.github.io/lab/shark/preview.png" />


    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="ocean" class="ocean">
        <div class="water-surface"></div>
        <div class="light-rays"></div>
        <div class="caustics"></div>
        <div class="depth-fog"></div>
        <div id="bubbles" class="bubbles"></div>

        <div id="shark" class="shark-actor">
            <!-- Shark faces RIGHT: head on the right, tail on the left, dorsal fin on top -->
            <svg viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop id="bodyGradTop" offset="0%" stop-color="#5CAAA0" />
                        <stop id="bodyGradMid" offset="55%" stop-color="#3D8B80" />
                        <stop id="bodyGradDeep" offset="100%" stop-color="#1B5E55" />
                    </linearGradient>
                    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop id="bellyGradLight" offset="0%" stop-color="#E8F5F3" />
                        <stop id="bellyGradMid" offset="100%" stop-color="#B2DFDB" />
                    </linearGradient>
                </defs>

                <g class="shark-rig">
                    <!-- Invisible tap target — easier for small fingers -->
                    <path class="shark-hit" d="M 52 50
                             C 52 28, 78 18, 118 18
                             C 158 18, 192 30, 200 50
                             C 192 70, 158 82, 118 82
                             C 78 82, 52 72, 52 50 Z" fill="transparent" />

                    <!-- Tail assembly — sways for propulsion -->
                    <g class="tail-group">
                        <path class="tail-lobe tail-lower shark-fin" d="M 38 52 L 8 68 L 8 52 Z" />
                        <path class="tail-lobe tail-upper shark-fin" d="M 38 48 L 8 32 L 8 48 Z" />
                        <path class="tail-stem shark-fin-stem" d="M 38 50 L 52 50" stroke-width="5"
                            stroke-linecap="round" />
                    </g>

                    <!-- Main torso -->
                    <path class="torso" d="M 52 50
                             C 52 28, 78 18, 118 18
                             C 158 18, 192 30, 200 50
                             C 192 70, 158 82, 118 82
                             C 78 82, 52 72, 52 50 Z" fill="url(#bodyGrad)" />

                    <!-- Lighter underside -->
                    <path class="belly" d="M 62 54
                             C 80 68, 130 72, 178 58
                             C 168 74, 130 80, 108 80
                             C 82 80, 66 68, 62 54 Z" fill="url(#bellyGrad)" opacity="0.85" />

                    <!-- Gill slits -->
                    <g class="gills shark-detail" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
                        <path d="M 158 44 Q 154 50 158 56" />
                        <path d="M 164 43 Q 160 50 164 57" />
                        <path d="M 170 42 Q 166 50 170 58" />
                    </g>

                    <!-- Pectoral fin (bottom side — visible from profile) -->
                    <g class="pectoral-group">
                        <path class="pectoral-fin shark-fin-mid"
                            d="M 108 62 C 102 78, 88 88, 78 82 C 90 74, 100 68, 108 62 Z" />
                    </g>

                    <!-- Dorsal fin — always on top -->
                    <path class="dorsal-fin shark-fin" d="M 108 22 L 118 4 L 132 22 Z" />

                    <path class="snout-highlight" d="M 196 48 C 204 49, 208 50, 210 50" stroke-width="2" fill="none"
                        stroke-linecap="round" opacity="0.45" />

                    <!-- Eye -->
                    <circle cx="182" cy="42" r="7" fill="#FAFAFA" />
                    <circle id="shark-pupil" cx="184" cy="41" r="3.5" fill="#1A1A1A" />
                    <circle cx="180" cy="40" r="1.5" fill="white" opacity="0.7" />

                    <!-- Mouth -->
                    <path id="shark-mouth" class="mouth shark-detail" d="M 198 54 Q 206 56 210 54" stroke-width="1.8"
                        fill="none" stroke-linecap="round" />
                </g>
            </svg>
        </div>
        <div id="fx-layer" class="fx-layer"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
