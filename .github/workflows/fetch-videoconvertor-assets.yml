name: Fetch Video Convertor Assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-convertor-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and prepare assets
        working-directory: ./video-convertor
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f setup-assets.mjs ]; then
            echo "::error::Missing video-convertor/setup-assets.mjs"
            exit 1
          fi

          if [ ! -f package.json ]; then
            npm init -y
          fi

          # Exclude installed dependencies from Git.
          if ! grep -qxF 'node_modules/' .gitignore 2>/dev/null; then
            printf '\nnode_modules/\n' >> .gitignore
          fi

          npm install --save-exact --no-audit --no-fund \
            @ffmpeg/ffmpeg@0.12.10 \
            @ffmpeg/core@0.12.6 \
            @ffmpeg/core-mt@0.12.6

          node setup-assets.mjs

      - name: Commit and push generated files
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            video-convertor/package.json \
            video-convertor/package-lock.json \
            video-convertor/.gitignore \
            video-convertor/.nojekyll \
            video-convertor/vendor/

          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi

          git commit -m "build: prepare video convertor assets"

          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"