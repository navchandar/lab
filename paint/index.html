<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav id="toolbar">
        <div id="tools">
            <button class="tool-btn active" data-tool="brush">🖌️</button>
            <button class="tool-btn" data-tool="rect">⬜</button>
            <button class="tool-btn" data-tool="circle">⭕</button>
            <button class="tool-btn" data-tool="star">⭐</button>
        </div>
        <div id="colors">
            <button class="color-btn active" data-color="#FF0000" style="background-color: #FF0000;"></button>
            <button class="color-btn" data-color="#0000FF" style="background-color: #0000FF;"></button>
            <button class="color-btn" data-color="#FFFF00" style="background-color: #FFFF00;"></button>
            <button class="color-btn" data-color="#008000" style="background-color: #008000;"></button>
            <button class="color-btn" data-color="#FFA500" style="background-color: #FFA500;"></button>
            <button class="color-btn" data-color="#800080" style="background-color: #800080;"></button>
            <button class="color-btn" data-color="#000000" style="background-color: #000000;"></button>
            <button class="color-btn" data-color="#FFFFFF"
                style="background-color: #FFFFFF; border: 2px solid #ccc;"></button>
        </div>
        <div id="actions">
            <button id="clearBtn">🗑️</button>
            <button id="saveBtn">💾</button>
        </div>
    </nav>
    <div id="canvas-container">
        <!-- Main canvas where final artwork lives -->
        <canvas id="board"></canvas>
        <!-- Transparent top canvas for live shape stretching -->
        <canvas id="previewBoard"></canvas>
    </div>
    <script src="app.js"></script>
</body>

</html>
