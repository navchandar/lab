<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Video Converter</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">


    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --card: #1e293b;
            --border: #475569;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --primary: #2563eb;
            --danger: #fca5a5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        main {
            max-width: 720px;
            margin: 24px auto;
            padding: 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }

        p {
            margin: 8px 0 20px;
        }

        .muted,
        small {
            color: var(--muted);
        }

        .field {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
        }

        input[type="file"] {
            border-style: dashed;
        }

        .checkbox {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-weight: 400;
        }

        .checkbox input {
            margin-top: 6px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        button,
        .download {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        button.secondary {
            background: #475569;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:hover:not(:disabled),
        .download:hover {
            filter: brightness(1.12);
        }

        :focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .status-area {
            margin-top: 24px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        progress {
            display: block;
            width: 100%;
            height: 14px;
            accent-color: #60a5fa;
        }

        #detail,
        #file-info,
        #mode {
            font-size: 0.9rem;
            overflow-wrap: anywhere;
        }

        .error {
            color: var(--danger);
        }

        #result {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .download {
            display: inline-block;
            background: #047857;
        }

        details {
            margin-top: 24px;
        }

        summary {
            cursor: pointer;
        }

        textarea {
            display: block;
            width: 100%;
            height: 180px;
            margin-top: 12px;
            padding: 12px;
            resize: vertical;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #020617;
            color: #a7f3d0;
            font: 12px/1.5 monospace;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            main {
                margin: 8px auto;
                padding: 20px;
            }

            .actions button {
                flex: 1 1 auto;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Local Video Converter</h1>
        <p class="muted">
            Video processing stays in your browser.
            The engine is downloaded only when needed.
        </p>

        <div class="field">
            <label for="file">Video file</label>
            <input id="file" type="file" accept="video/*,.mkv,.avi,.mov,.webm,.m4v,.ts">
            <p id="file-info" class="muted">
                Maximum selection size: 500 MiB.
                Large files may exceed your browser’s available memory.
            </p>
        </div>

        <div class="field">
            <label for="preset">Conversion preset</label>
            <select id="preset">
                <option value="standard">Standard MP4 - good quality</option>
                <option value="mov">QuickTime MOV - H.264 / AAC</option>
                <option value="compress">Smaller MP4 - CRF 28, 96k audio</option>
                <option value="heavy">Heavy compression - CRF 32, 64k audio</option>
                <option value="1080">Fit within 1920 × 1080 - no upscaling</option>
                <option value="720">Fit within 1280 × 720 - no upscaling</option>
                <option value="speed2">Speed up 2×</option>
                <option value="copy">Fastest MP4 - copy compatible streams</option>
            </select>
        </div>

        <div class="field">
            <label for="speed">Encoding speed</label>
            <select id="speed">
                <option value="veryfast">Very fast - recommended</option>
                <option value="ultrafast">Fastest encoding - usually larger files</option>
                <option value="fast">Better compression - slower</option>
            </select>
            <small>Not used when copying streams.</small>
        </div>

        <div class="field">
            <label class="checkbox">
                <input id="faststart" type="checkbox" checked>
                <span>
                    Optimize for web playback
                    <small>
                        - moves metadata to the beginning; adds finalization work.
                    </small>
                </span>
            </label>
        </div>

        <div class="actions">
            <button id="convert" disabled>Convert video</button>
            <button id="cancel" class="secondary" disabled>Cancel</button>
            <button id="clear-cache" class="secondary" disabled>
                Clear engine cache
            </button>
        </div>

        <section class="status-area" aria-label="Conversion status">
            <div class="status-row">
                <span id="status" role="status" aria-live="polite">
                    Preparing application…
                </span>
                <span id="percent"></span>
            </div>

            <progress id="progress" max="100" value="0" aria-label="Conversion progress"></progress>

            <p id="detail" class="muted"></p>
            <p id="mode" class="muted"></p>
        </section>

        <section id="result" hidden>
            <p id="result-info"></p>
            <a id="download" class="download" download>Save converted video</a>
        </section>

        <details>
            <summary>FFmpeg logs</summary>
            <textarea id="logs" readonly aria-label="FFmpeg logs"></textarea>
        </details>
    </main>

    <script type="module">
        const BASE = new URL("./", window.location.href);
        const CACHE_PREFIX = `video-converter:${BASE.pathname}:`;
        const CACHE_NAME = `${CACHE_PREFIX}assets-v1`;

        const MAX_SIZE = 500 * 1024 * 1024;   // 500MB in bytes
        const RELEASE_AFTER_SIZE = 150 * 1024 * 1024;

        const $ = (id) => document.getElementById(id);

        const ui = {
            file: $("file"),
            fileInfo: $("file-info"),
            preset: $("preset"),
            speed: $("speed"),
            faststart: $("faststart"),
            convert: $("convert"),
            cancel: $("cancel"),
            clearCache: $("clear-cache"),
            status: $("status"),
            percent: $("percent"),
            progress: $("progress"),
            detail: $("detail"),
            mode: $("mode"),
            result: $("result"),
            resultInfo: $("result-info"),
            download: $("download"),
            logs: $("logs")
        };

        let ready = false;
        let busy = false;
        let maintenance = false;
        let engine = null;
        let activeJob = null;
        let outputURL = null;
        let phase = "idle";

        // Keep logging bounded and avoid updating the textarea per message.
        let logLines = [];
        let logsDirty = false;

        function log(message) {
            logLines.push(String(message));

            if (logLines.length > 200) {
                logLines.splice(0, logLines.length - 200);
            }

            logsDirty = true;
        }

        function flushLogs() {
            if (!logsDirty) {
                return;
            }

            ui.logs.value = logLines.join("\n");
            ui.logs.scrollTop = ui.logs.scrollHeight;
            logsDirty = false;
        }

        setInterval(flushLogs, 200);

        function bytes(value) {
            return `${(value / 1024 / 1024).toFixed(1)} MiB`;
        }

        function duration(seconds) {
            const total = Math.max(0, Math.round(seconds));
            const minutes = Math.floor(total / 60);
            const remainder = total % 60;

            return `${minutes}m ${String(remainder).padStart(2, "0")}s`;
        }

        function setStatus(message, isError = false) {
            ui.status.textContent = message;
            ui.status.classList.toggle("error", isError);
        }

        function setProgress(value = null, text = "") {
            if (value === null) {
                ui.progress.removeAttribute("value");
            } else {
                ui.progress.value = value;
            }

            ui.percent.textContent = text;
        }

        function selectedFile() {
            return ui.file.files?.[0] ?? null;
        }

        function validFile(file) {
            return Boolean(file && file.size > 0 && file.size <= MAX_SIZE);
        }

        function syncUI() {
            const locked = !ready || busy || maintenance;

            ui.file.disabled = locked;
            ui.preset.disabled = locked;
            ui.faststart.disabled = locked;
            ui.speed.disabled = locked || ui.preset.value === "copy";

            ui.convert.disabled = locked || !validFile(selectedFile());
            ui.cancel.disabled = !busy || Boolean(activeJob?.cancelled);
            ui.clearCache.disabled = locked;
        }

        function validateFile() {
            const file = selectedFile();
            ui.fileInfo.classList.remove("error");

            if (!file) {
                ui.fileInfo.textContent =
                    "Maximum selection size: 500 MiB. Large files need substantial memory.";
            } else if (file.size === 0) {
                ui.fileInfo.textContent = "The selected file is empty.";
                ui.fileInfo.classList.add("error");
            } else if (file.size > MAX_SIZE) {
                ui.fileInfo.textContent =
                    `${file.name} - ${bytes(file.size)}. The limit is 500 MiB.`;
                ui.fileInfo.classList.add("error");
            } else {
                ui.fileInfo.textContent = `${file.name} - ${bytes(file.size)}`;
            }

            syncUI();
        }

        function checkCancelled(job) {
            if (job.cancelled || job.abort.signal.aborted) {
                throw new DOMException("Conversion cancelled", "AbortError");
            }
        }

        function discardOutput() {
            if (outputURL) {
                URL.revokeObjectURL(outputURL);
                outputURL = null;
            }

            ui.download.removeAttribute("href");
            ui.result.hidden = true;
        }

        function destroyEngine(instance) {
            try {
                instance?.terminate();
            } catch {
                // Already terminated.
            }

            if (engine?.instance === instance) {
                engine = null;
            }
        }

        // Stream missing assets into Cache Storage in parallel.
        // The service worker then serves them at their normal local URLs.
        async function warmAssets(urls, job) {
            if (!navigator.serviceWorker?.controller || !("caches" in window)) {
                return;
            }

            let cache;

            try {
                cache = await caches.open(CACHE_NAME);
            } catch {
                log("Cache Storage is unavailable; using normal browser loading.");
                return;
            }

            await Promise.all(urls.map(async (url) => {
                checkCancelled(job);

                const cached = await cache.match(url);

                if (cached) {
                    log(`Cached: ${new URL(url).pathname}`);
                    return;
                }

                log(`Downloading: ${new URL(url).pathname}`);

                // The service worker intentionally bypasses no-cache requests.
                // This avoids recursively caching the same preload request.
                const response = await fetch(url, {
                    signal: job.abort.signal,
                    cache: "no-cache"
                });

                if (!response.ok) {
                    throw new Error(
                        `Asset download failed: ${response.status} ${url}`
                    );
                }

                try {
                    await cache.put(url, response);
                } catch (error) {
                    checkCancelled(job);
                    log(`Could not retain asset in cache: ${error.message}`);
                    // FFmpeg can still load the asset directly afterward.
                }

                checkCancelled(job);
            }));
        }

        function updateConversionProgress(instance, progress) {
            if (
                activeJob?.engine !== instance ||
                activeJob.cancelled ||
                phase !== "convert"
            ) {
                return;
            }

            // Duration-changing filters make FFmpeg's percentage unreliable.
            if (activeJob.preset === "speed2") {
                setProgress(null, "Working…");
                return;
            }

            if (!Number.isFinite(progress) || progress <= 0) {
                return;
            }

            const fraction = Math.min(0.99, Math.max(0, progress));
            const percent = Math.floor(fraction * 100);

            setProgress(percent, `~${percent}%`);

            const elapsed = (performance.now() - activeJob.encodeStarted) / 1000;

            if (fraction > 0.02 && elapsed > 3) {
                const remaining = elapsed * (1 - fraction) / fraction;

                ui.detail.textContent =
                    `Elapsed ${duration(elapsed)} · ` +
                    `Estimated remaining ${duration(remaining)}. Progress is approximate.`;
            }
        }

        async function getEngine(job) {
            if (engine?.instance.loaded) {
                job.engine = engine.instance;
                return engine;
            }

            setStatus("Loading video engine…");
            setProgress(null, "Loading");

            const wrapperURL =
                new URL("vendor/ffmpeg-0.12.10/index.js", BASE).href;

            const { FFmpeg } = await import(wrapperURL);
            checkCancelled(job);

            const supportsThreads =
                window.crossOriginIsolated &&
                typeof SharedArrayBuffer !== "undefined";

            const modes = supportsThreads ? ["mt", "st"] : ["st"];

            for (const mode of modes) {
                const directory = mode === "mt"
                    ? "vendor/core-mt-0.12.6/"
                    : "vendor/core-0.12.6/";

                const coreBase = new URL(directory, BASE);

                const config = {
                    coreURL: new URL("ffmpeg-core.js", coreBase).href,
                    wasmURL: new URL("ffmpeg-core.wasm", coreBase).href
                };

                if (mode === "mt") {
                    config.workerURL =
                        new URL("ffmpeg-core.worker.js", coreBase).href;
                }

                const instance = new FFmpeg();
                job.engine = instance;

                instance.on("log", ({ message }) => {
                    if (activeJob?.engine === instance) {
                        log(message);
                    }
                });

                instance.on("progress", ({ progress }) => {
                    updateConversionProgress(instance, progress);
                });

                try {
                    ui.detail.textContent =
                        "First use downloads the engine; later uses can read cached assets.";

                    await warmAssets(Object.values(config), job);
                    checkCancelled(job);

                    await instance.load(config);
                    checkCancelled(job);

                    engine = { instance, mode };

                    ui.mode.textContent = mode === "mt"
                        ? "Engine: multi-threaded"
                        : "Engine: single-threaded";

                    return engine;
                } catch (error) {
                    destroyEngine(instance);
                    checkCancelled(job);

                    if (mode === "st") {
                        throw error;
                    }

                    log(`Multi-thread initialization failed: ${error.message}`);
                    log("Trying the single-thread engine.");
                    setStatus("Trying single-thread engine…");
                }
            }

            throw new Error("No usable FFmpeg engine.");
        }

        function buildArgs(inputPath, outputPath, job, mode) {
            const args = [
                "-hide_banner",
                "-y",
                "-i", inputPath,
                "-map", "0:v:0",
                "-map", "0:a:0?",
                "-sn",
                "-dn"
            ];

            if (job.preset === "copy") {
                args.push("-c", "copy");
            } else {
                let crf = "23";
                let audioRate = "192k";

                // Ensure even dimensions for H.264 / yuv420p output.
                const filters = [
                    "scale=trunc(iw/2)*2:trunc(ih/2)*2"
                ];

                switch (job.preset) {
                    case "compress":
                        crf = "28";
                        audioRate = "96k";
                        break;

                    case "heavy":
                        crf = "32";
                        audioRate = "64k";
                        break;

                    case "1080":
                    case "720": {
                        const width = job.preset === "1080" ? 1920 : 1280;
                        const height = job.preset === "1080" ? 1080 : 720;

                        filters[0] =
                            `scale=w='min(${width},iw)':h='min(${height},ih)'` +
                            ":force_original_aspect_ratio=decrease" +
                            ":force_divisible_by=2";

                        filters.push("setsar=1");
                        crf = "28";
                        audioRate = "96k";
                        break;
                    }

                    case "speed2":
                        filters.unshift("setpts=0.5*(PTS-STARTPTS)");
                        args.push("-af", "atempo=2.0,asetpts=PTS-STARTPTS");
                        audioRate = "128k";
                        break;
                }

                const threads = mode === "mt"
                    ? Math.min(
                        4,
                        Math.max(1, (navigator.hardwareConcurrency || 2) - 1)
                    )
                    : 1;

                args.push(
                    "-vf", filters.join(","),
                    "-c:v", "libx264",
                    "-preset", job.speed,
                    "-crf", crf,
                    "-pix_fmt", "yuv420p",
                    "-threads", String(threads),
                    "-c:a", "aac",
                    "-b:a", audioRate
                );
            }

            if (job.faststart) {
                args.push("-movflags", "+faststart");
            }

            args.push(outputPath);
            return args;
        }

        async function cleanFiles(instance, mounted, inputPath, outputPath) {
            if (!instance?.loaded) {
                return;
            }

            // Each operation is independent: one missing file should not prevent
            // the remaining cleanup.
            const operations = [];

            if (mounted) {
                operations.push(() => instance.unmount("/input"));
            } else if (inputPath) {
                operations.push(() => instance.deleteFile(inputPath));
            }

            operations.push(
                () => instance.deleteFile(outputPath),
                () => instance.deleteDir("/input")
            );

            for (const operation of operations) {
                try {
                    await operation();
                } catch {
                    // File/directory may not exist after cancellation or failure.
                }
            }
        }

        async function convert() {
            const file = selectedFile();

            if (busy || maintenance || !validFile(file)) {
                return;
            }

            const job = {
                cancelled: false,
                abort: new AbortController(),
                engine: null,
                preset: ui.preset.value,
                speed: ui.speed.value,
                faststart: ui.faststart.checked,
                started: performance.now(),
                encodeStarted: 0
            };

            activeJob = job;
            busy = true;
            phase = "load";

            discardOutput();
            logLines = [];
            logsDirty = true;
            ui.detail.textContent = "";
            setStatus("Preparing conversion…");
            setProgress(null);
            syncUI();

            let instance = null;
            let mounted = false;
            let inputPath = null;
            let succeeded = false;

            const extension = job.preset === "mov" ? ".mov" : ".mp4";
            const outputPath = `/output${extension}`;

            try {
                const loaded = await getEngine(job);
                instance = loaded.instance;
                checkCancelled(job);

                setStatus("Preparing input…");

                await instance.createDir("/input");
                checkCancelled(job);

                try {
                    // Avoid copying the complete input into MEMFS when supported.
                    mounted = await instance.mount(
                        "WORKERFS",
                        { files: [file] },
                        "/input"
                    );

                    if (!mounted) {
                        throw new Error("WORKERFS mount was unavailable.");
                    }

                    inputPath = `/input/${file.name}`;
                    log("Input mounted with WORKERFS.");
                } catch (error) {
                    checkCancelled(job);

                    log(`Using copied input instead: ${error.message}`);

                    inputPath = "/input/input.bin";
                    const inputData = new Uint8Array(await file.arrayBuffer());

                    checkCancelled(job);
                    await instance.writeFile(inputPath, inputData);
                }

                checkCancelled(job);

                const args = buildArgs(inputPath, outputPath, job, loaded.mode);

                phase = "convert";
                job.encodeStarted = performance.now();

                setStatus(
                    job.preset === "copy" ? "Copying compatible streams…" : "Converting…"
                );
                setProgress(null, "Working…");
                log(`Arguments: ${JSON.stringify(args)}`);

                const exitCode = await instance.exec(args);
                checkCancelled(job);

                if (exitCode !== 0) {
                    const hint = job.preset === "copy"
                        ? " The input codecs may not support MP4; try Standard MP4."
                        : " Expand the FFmpeg logs for details.";

                    throw new Error(`FFmpeg exited with code ${exitCode}.${hint}`);
                }

                phase = "finalize";
                setStatus("Preparing local download…");
                setProgress(null, "Finalizing");
                ui.detail.textContent = "";

                const data = await instance.readFile(outputPath);
                checkCancelled(job);

                if (!(data instanceof Uint8Array) || data.byteLength === 0) {
                    throw new Error("FFmpeg did not produce a non-empty video.");
                }

                const blob = new Blob([data], {
                    type: extension === ".mov" ? "video/quicktime" : "video/mp4"
                });

                outputURL = URL.createObjectURL(blob);

                const baseName =
                    file.name.replace(/\.[^.]+$/, "") || "video";

                ui.download.href = outputURL;
                ui.download.download = `${baseName}_converted${extension}`;

                const elapsed = (performance.now() - job.started) / 1000;
                const change = (1 - blob.size / file.size) * 100;

                const comparison = change >= 0
                    ? `${change.toFixed(1)}% smaller`
                    : `${Math.abs(change).toFixed(1)}% larger`;

                ui.resultInfo.textContent =
                    `${bytes(file.size)} → ${bytes(blob.size)} ` +
                    `(${comparison}) · Total time ${duration(elapsed)}`;

                ui.result.hidden = false;
                succeeded = true;

                setStatus("Conversion complete");
                setProgress(100, "100%");
                ui.detail.textContent =
                    "The output is local. Use Save converted video to save it.";
            } catch (error) {
                if (job.cancelled || error.name === "AbortError") {
                    setStatus("Cancelled");
                    ui.detail.textContent =
                        "The next conversion will restart the engine if necessary.";
                } else {
                    console.error(error);
                    log(error.stack || error.message || String(error));

                    setStatus("Conversion failed", true);
                    ui.detail.textContent = error.message || String(error);
                }

                setProgress(0);
            } finally {
                phase = "cleanup";

                await cleanFiles(instance, mounted, inputPath, outputPath);

                if (
                    instance &&
                    (!succeeded || file.size >= RELEASE_AFTER_SIZE)
                ) {
                    destroyEngine(instance);
                }

                activeJob = null;
                busy = false;
                phase = "idle";

                flushLogs();
                syncUI();
            }
        }

        ui.file.addEventListener("change", validateFile);
        ui.preset.addEventListener("change", syncUI);
        ui.convert.addEventListener("click", convert);

        ui.cancel.addEventListener("click", () => {
            if (!activeJob || activeJob.cancelled) {
                return;
            }

            activeJob.cancelled = true;
            activeJob.abort.abort();

            destroyEngine(activeJob.engine);

            setStatus("Stopping…");
            syncUI();
        });

        ui.clearCache.addEventListener("click", async () => {
            if (busy || maintenance) {
                return;
            }

            maintenance = true;
            syncUI();

            try {
                if ("caches" in window) {
                    const keys = await caches.keys();

                    await Promise.all(
                        keys
                            .filter((key) => key.startsWith(CACHE_PREFIX))
                            .map((key) => caches.delete(key))
                    );
                }

                destroyEngine(engine?.instance);
                ui.mode.textContent = "";

                setStatus("Engine cache cleared");
                ui.detail.textContent =
                    "This clears this app’s Cache Storage and loaded engine, " +
                    "not the browser’s separate HTTP cache.";
            } catch (error) {
                setStatus("Could not clear engine cache", true);
                ui.detail.textContent = error.message;
            } finally {
                maintenance = false;
                syncUI();
            }
        });

        window.addEventListener("beforeunload", (event) => {
            if (busy) {
                event.preventDefault();
                event.returnValue = "";
            }
        });

        /**
     * Wait briefly for our service worker to control this document.
     *
     * Failure or timeout is non-fatal: the app can still use the
     * single-thread engine and normal browser HTTP caching.
     */
        function waitForAppController(scriptURL, timeoutMs = 5000) {
            const expectedURL = new URL(scriptURL, BASE).href;

            function isOurController() {
                return navigator.serviceWorker.controller?.scriptURL === expectedURL;
            }

            if (isOurController()) {
                return Promise.resolve(true);
            }

            return new Promise((resolve) => {
                let timer;

                const finish = (controlled) => {
                    clearTimeout(timer);

                    navigator.serviceWorker.removeEventListener(
                        "controllerchange",
                        onControllerChange
                    );

                    resolve(controlled);
                };

                const onControllerChange = () => {
                    if (isOurController()) {
                        finish(true);
                    }
                };

                navigator.serviceWorker.addEventListener(
                    "controllerchange",
                    onControllerChange
                );

                timer = setTimeout(() => {
                    finish(isOurController());
                }, timeoutMs);

                // Avoid missing a controller change between the initial check
                // and attaching the event listener.
                onControllerChange();
            });
        }

        /**
         * Register or update this app's service worker without reloading.
         *
         * Registering a new script at an existing registration's scope
         * updates that registration. Unregistering it first is unnecessary.
         */
        async function prepareServiceWorker() {
            if (
                !window.isSecureContext ||
                !("serviceWorker" in navigator)
            ) {
                log(
                    "Service workers are unavailable. " +
                    "Continuing without app-managed asset caching."
                );

                return;
            }

            const workerURL = new URL("converter-sw.js", BASE).href;

            try {
                const registration = await navigator.serviceWorker.register(
                    workerURL,
                    {
                        scope: BASE.pathname,

                        // Check the worker script against the network rather
                        // than relying on a stale HTTP-cached worker script.
                        // This does not disable caching of FFmpeg assets.
                        updateViaCache: "none"
                    }
                );

                // The supplied converter-sw.js already calls skipWaiting()
                // during installation. This also supports a waiting version
                // that implements the message handler shown below.
                registration.waiting?.postMessage({
                    type: "SKIP_WAITING"
                });

                const controlled = await waitForAppController(workerURL);

                if (controlled) {
                    log("App service worker is active. No reload was requested.");
                } else {
                    log(
                        "Service worker registration succeeded, but this page is " +
                        "not yet controlled by the new worker. Continuing without reloading."
                    );
                }

                if (window.crossOriginIsolated) {
                    log("Cross-origin isolation is enabled.");
                } else {
                    log(
                        "This document is not cross-origin isolated. " +
                        "Using the single-thread engine for this visit. " +
                        "A later normal navigation may enable multi-threading."
                    );
                }
            } catch (error) {
                log(
                    `Service worker setup failed: ${error.message}. ` +
                    "Continuing without forcing a reload."
                );
            }
        }

        async function boot() {
            if (window.location.protocol === "file:") {
                setStatus("Open this app through localhost or HTTPS", true);

                ui.detail.textContent =
                    "Do not open index.html directly. " +
                    "Serve it through localhost or deploy it to HTTPS hosting.";

                return;
            }

            await prepareServiceWorker();

            ready = true;

            setStatus("Choose a video to begin");
            setProgress(0);

            const supportsThreads =
                window.crossOriginIsolated &&
                typeof SharedArrayBuffer !== "undefined";

            ui.mode.textContent = supportsThreads
                ? "Multi-threading is available."
                : "Single-thread mode for this visit - no reload required.";

            validateFile();
        }
        boot().catch((error) => {
            setStatus("Application initialization failed", true);
            ui.detail.textContent = error.message;
            console.error(error);
        });
    </script>
